          data_autuacao: dataAutuacao,

    };

    // ==========================================
    // COMPONENTE PRINCIPAL
    // ==========================================
    function JuriFlowCRM() {
      const [activeTab, setActiveTab] = useState("kanban");

      // API Config
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("juriflow_api_key") || DEFAULT_API_KEY);
      const [apiEndpoint, setApiEndpoint] = useState(() => localStorage.getItem("juriflow_api_endpoint") || OFFICIAL_API_BASE);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [apiTestStatus, setApiTestStatus] = useState(null);
      const [apiTestMessage, setApiTestMessage] = useState("");

      // State Leads & Pool
      const [leads, setLeads] = useState(() => {
        const saved = localStorage.getItem("juriflow_leads_v2");
        return saved ? JSON.parse(saved) : getInitialLeads();
      });

      const [poolLeads, setPoolLeads] = useState(() => {
        const saved = localStorage.getItem("juriflow_pool_v2");
        return saved ? JSON.parse(saved) : getInitialPoolLeads();
      });

      // Busca State
      const [searchTerm, setSearchTerm] = useState("33.000.167/0001-01");
      const [poloFilter, setPoloFilter] = useState("Ambos");
      const [comarcaFilter, setComarcaFilter] = useState("");
      const [selectedClasses, setSelectedClasses] = useState(["Execução de Título Extrajudicial", "Execução Fiscal"]);
      const [isClassDropdownOpen, setIsClassDropdownOpen] = useState(false);
      const [valorMin, setValorMin] = useState("");
      const [valorMax, setValorMax] = useState("");
      const [dataInicio, setDataInicio] = useState("");
      const [dataFim, setDataFim] = useState("");
      const [isSearching, setIsSearching] = useState(false);
      const [searchResults, setSearchResults] = useState([]);
      const [selectedResultIds, setSelectedResultIds] = useState(new Set());
      const [searchDataSource, setSearchDataSource] = useState(null);
      const [apiSearchError, setApiSearchError] = useState(null);

      // Gatekeeper Contrato Fechado (Modal de Upload Obrigatório)
      const [leadPendingClosing, setLeadPendingClosing] = useState(null);
      const [uploadedContractFile, setUploadedContractFile] = useState(null);

      // Modal de Detalhes & Documentos
      const [selectedLeadModal, setSelectedLeadModal] = useState(null);
      const [modalActiveTab, setModalActiveTab] = useState("dados");
      const [toastMessage, setToastMessage] = useState(null);
      const [draggedLeadId, setDraggedLeadId] = useState(null);

      const [currentTime, setCurrentTime] = useState(Date.now());

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(Date.now()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Persistência
      useEffect(() => {
        localStorage.setItem("juriflow_leads_v2", JSON.stringify(leads));
      }, [leads]);

      useEffect(() => {
        localStorage.setItem("juriflow_pool_v2", JSON.stringify(poolLeads));
      }, [poolLeads]);

      useEffect(() => {
        localStorage.setItem("juriflow_api_key", apiKey);
        localStorage.setItem("juriflow_api_endpoint", apiEndpoint);
      }, [apiKey, apiEndpoint]);

      const showToast = (title, type = "success") => {
        setToastMessage({ title, type, id: Date.now() });
        setTimeout(() => setToastMessage(null), 3500);
      };

      // VERIFICAÇÃO AUTOMÁTICA DE 5 DIAS (Expira para o Pool)
      useEffect(() => {
        const expired = leads.filter(l => !l.isClosed && l.stage !== 'contrato_fechado' && l.expiresAt && l.expiresAt <= currentTime);
        if (expired.length > 0) {
          const toPool = expired.map(l => ({
            ...l,
            stage: "recem_importados",
            assignedLawyer: null,
            previousLawyer: l.assignedLawyer || "Dr. Titular",
            expiredAt: currentTime
          }));
          setPoolLeads(prev => [...toPool, ...prev]);
          setLeads(prev => prev.filter(l => !expired.some(e => e.id === l.id)));
          showToast(`${expired.length} lead(s) com prazo de 5 dias expirado transferidos para o Pool Geral!`, "warning");
        }
      }, [currentTime, leads]);

      const getTimeRemaining = (expiresAt, isClosed) => {
        if (isClosed || !expiresAt) {
          return { text: "Exclusividade Permanente", isUrgent: false, isClosed: true, totalHours: Infinity };
        }
        const diffMs = expiresAt - currentTime;
        if (diffMs <= 0) {
          return { text: "Expirado", isUrgent: true, isExpired: true, totalHours: 0 };
        }
        const totalHours = Math.floor(diffMs / (1000 * 60 * 60));
        const days = Math.floor(totalHours / 24);
        const hours = totalHours % 24;
        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diffMs % (1000 * 60)) / 1000);

        const isUrgent = totalHours < 24;
        let text = days > 0 ? `${days}d ${hours}h restantes` : hours > 0 ? `${hours}h ${minutes}m restantes` : `${minutes}m ${seconds}s restantes`;
        return { text, isUrgent, isClosed: false, totalHours };
      };

      const handleRenewExclusivity = (leadId, e) => {
        if (e) e.stopPropagation();
        setLeads(prev => prev.map(lead => {
          if (lead.id === leadId) {
            return { ...lead, expiresAt: currentTime + FIVE_DAYS_MS };
          }
          return lead;
        }));
        showToast("Exclusividade renovada por +5 dias (+120h)!", "success");
        if (selectedLeadModal && selectedLeadModal.id === leadId) {
          setSelectedLeadModal(prev => ({ ...prev, expiresAt: currentTime + FIVE_DAYS_MS }));
        }
      };

      // TENTATIVA DE MUDANÇA DE ETAPA (com GATEKEEPER para Contrato Fechado)
      const handleRequestStageChange = (leadId, targetStageId) => {
        if (targetStageId === "contrato_fechado") {
          const targetLead = leads.find(l => l.id === leadId);
          if (targetLead) {
            setLeadPendingClosing(targetLead);
            setUploadedContractFile(targetLead.contractPdf || null);
          }
          return;
        }

        executeStageMove(leadId, targetStageId);
      };

      const executeStageMove = (leadId, targetStageId, contractPdfData = null) => {
        setLeads(prev => prev.map(lead => {
          if (lead.id === leadId) {
            const willBeClosed = targetStageId === "contrato_fechado";
            const updatedDocs = { ...(lead.documents || {}) };
            if (contractPdfData) {
              updatedDocs.contrato_assinado = contractPdfData;
            }

            return {
              ...lead,
              stage: targetStageId,
              isClosed: willBeClosed,
              expiresAt: willBeClosed ? null : (lead.expiresAt || currentTime + FIVE_DAYS_MS),
              contractPdf: contractPdfData || lead.contractPdf,
              documents: updatedDocs
            };
          }
          return lead;
        }));

        if (targetStageId === "contrato_fechado") {
          showToast("🎉 Contrato Fechado! Contrato anexado e exclusividade congelada em definitivo.", "success");
        } else {
          showToast("Etapa atualizada!", "info");
        }

        if (selectedLeadModal && selectedLeadModal.id === leadId) {
          setSelectedLeadModal(prev => ({
            ...prev,
            stage: targetStageId,
            isClosed: targetStageId === "contrato_fechado",
            expiresAt: targetStageId === "contrato_fechado" ? null : prev.expiresAt
          }));
        }
      };

      // Confirmação do Gatekeeper de Contrato Fechado
      const handleConfirmClosingWithContract = () => {
        if (!uploadedContractFile || !leadPendingClosing) {
          showToast("É obrigatório anexar o PDF do contrato assinado para fechar o lead!", "warning");
          return;
        }

        executeStageMove(leadPendingClosing.id, "contrato_fechado", uploadedContractFile);
        
        const updatedLead = leads.find(l => l.id === leadPendingClosing.id);
        if (updatedLead) {
          setSelectedLeadModal({
            ...updatedLead,
            stage: "contrato_fechado",
            isClosed: true,
            contractPdf: uploadedContractFile,
            documents: { ...(updatedLead.documents || {}), contrato_assinado: uploadedContractFile }
          });
          setModalActiveTab("documentos");
        }

        setLeadPendingClosing(null);
        setUploadedContractFile(null);
      };

      // Simulação / Upload de Documento do Cliente
      const handleFileUploadForSlot = (slotId, file) => {
        if (!selectedLeadModal || !file) return;

        const docInfo = {
          name: file.name,
          size: `${(file.size / 1024).toFixed(1)} KB`,
          date: new Date().toLocaleDateString('pt-BR'),
          type: file.type || 'application/pdf'
        };

        const updatedDocs = {
          ...(selectedLeadModal.documents || {}),
          [slotId]: docInfo
        };

        setLeads(prev => prev.map(l => l.id === selectedLeadModal.id ? { ...l, documents: updatedDocs } : l));
        setSelectedLeadModal(prev => ({ ...prev, documents: updatedDocs }));
        showToast(`Documento "${docInfo.name}" anexado com sucesso!`, "success");
      };

      // Drag & Drop Kanban
      const handleDragStart = (leadId) => setDraggedLeadId(leadId);
      const handleDragOver = (e) => e.preventDefault();
      const handleDrop = (targetStageId) => {
        if (draggedLeadId) {
          handleRequestStageChange(draggedLeadId, targetStageId);
          setDraggedLeadId(null);
        }
      };

      // Resgate do Pool
      const handleClaimPoolLead = (poolLeadId) => {
        const poolLead = poolLeads.find(p => p.id === poolLeadId);
        if (!poolLead) return;

        const newLead = {
          ...poolLead,
          id: `claimed_${Date.now()}_${poolLead.id}`,
          stage: "recem_importados",
          assignedLawyer: "Dr. Você (Titular)",
          importedAt: currentTime,
          expiresAt: currentTime + FIVE_DAYS_MS,
          isClosed: false
        };

        setLeads(prev => [newLead, ...prev]);
        setPoolLeads(prev => prev.filter(p => p.id !== poolLeadId));
        showToast("Lead resgatado com sucesso para o seu Kanban (+5 dias)!", "success");
      };

      // EXECUÇÃO DA CONSULTA REAL NA API BUSCA PROCESSOS
      const handleExecuteSearch = async () => {
        setApiSearchError(null);
        const onlyNumbers = searchTerm.replace(/\D/g, "");

        if (!onlyNumbers || (onlyNumbers.length !== 11 && onlyNumbers.length !== 14)) {
          setApiSearchError("A API do Busca Processos exige um CPF (11 dígitos) ou CNPJ (14 dígitos) válido.");
          showToast("Informe um CPF ou CNPJ com apenas dígitos para consultar a API.", "warning");
          return;
        }

        setIsSearching(true);
        setSelectedResultIds(new Set());
        setSearchResults([]);
        setSearchDataSource(null);

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 25000);

          const targetUrl = `${apiEndpoint}/v1/processos?cpf_cnpj=${onlyNumbers}&limit=50`;

          const response = await fetch(targetUrl, {
            method: 'GET',
            headers: {
              'x-api-key': apiKey.trim(),
              'Accept': 'application/json'
            },
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          if (!response.ok) {
            const errData = await response.json().catch(() => null);
            const errMsg = errData?.error?.message || `Erro HTTP ${response.status} na API Busca Processos.`;
            setApiSearchError(errMsg);
            showToast(errMsg, "warning");
            setIsSearching(false);
            return;
          }

          const data = await response.json();
          const parsed = parseBuscaProcessosApiResponse(data);

          if (parsed.length > 0) {
            setSearchResults(parsed);
            setSearchDataSource("api_real");
            showToast(`${parsed.length} processos reais obtidos diretamente da API Busca Processos!`, "success");
          } else {
            setApiSearchError("Nenhum processo público encontrado para este documento nos tribunais consultados.");
            showToast("Nenhum processo retornado para este documento.", "info");
          }
        } catch (err) {
          console.error("Erro na chamada da API:", err);
          setApiSearchError(`Falha de conexão com a API (${err.message}). Verifique a chave ou endpoint.`);
          showToast("Falha ao comunicar com a API do Busca Processos.", "warning");
        } finally {
          setIsSearching(false);
        }
      };

      // Geração Manual de Teste (Apenas sob demanda explícita)
      const handleGenerateTestDataset = () => {
        const dummy = [
          {
            id: `test_1_${Date.now()}`,
            numero_processo: "1002345-12.2024.8.26.0100",
            classe: "Execução de Título Extrajudicial",
            tribunal: "TJSP",
            comarca: "São Paulo - Foro Central Cível",
            polo_ativo: "Banco Bradesco S/A",
            polo_passivo: "Construtora Horizonte Ltda",
            valor_causa: 385000,
            data_autuacao: "2024-02-14",
            isRealApiData: false
          },
          {
            id: `test_2_${Date.now()}`,
            numero_processo: "0014522-88.2024.8.26.0114",
            classe: "Execução de Título Extrajudicial",
            tribunal: "TJSP",
            comarca: "Campinas",
            polo_ativo: "Fundo de Investimento Creditório Itaú",
            polo_passivo: "Distribuidora de Alimentos União S/A",
            valor_causa: 620000,
            data_autuacao: "2024-03-01",
            isRealApiData: false
          },
          {
            id: `test_3_${Date.now()}`,
            numero_processo: "5003211-40.2024.4.03.6100",
            classe: "Execução Fiscal",
            tribunal: "TRF-3",
            comarca: "São Paulo",
            polo_ativo: "Fazenda Nacional",
            polo_passivo: "Metalúrgica Paulista Ltda",
            valor_causa: 890000,
            data_autuacao: "2024-01-20",
            isRealApiData: false
          }
        ];
        setSearchResults(dummy);
        setSearchDataSource("fallback_simulado");
        showToast("Exemplos com Execução de Título Extrajudicial carregados para teste de filtros!", "info");
      };

      // FILTRAGEM DINÂMICA
      const filteredSearchResults = useMemo(() => {
        return searchResults.filter(item => {
          if (poloFilter === "Polo Ativo") {
            const doc = searchTerm.replace(/\D/g, "");
            if (item.polo_passivo.includes(doc)) return false;
          } else if (poloFilter === "Polo Passivo") {
            const doc = searchTerm.replace(/\D/g, "");
            if (item.polo_ativo.includes(doc)) return false;
          }

          if (selectedClasses.length > 0 && !selectedClasses.includes(item.classe)) {
            return false;
          }

          if (comarcaFilter.trim()) {
            const term = comarcaFilter.trim().toLowerCase();
            if (!item.comarca || !item.comarca.toLowerCase().includes(term)) {
              return false;
            }
          }

          if (valorMin && item.valor_causa < parseFloat(valorMin)) return false;
          if (valorMax && item.valor_causa > parseFloat(valorMax)) return false;

          if (dataInicio && item.data_autuacao < dataInicio) return false;
          if (dataFim && item.data_autuacao > dataFim) return false;

          return true;
        });
      }, [searchResults, poloFilter, selectedClasses, comarcaFilter, valorMin, valorMax, dataInicio, dataFim, searchTerm]);

      // Importar Selecionados
      const handleImportSelected = () => {
        if (selectedResultIds.size === 0) {
          showToast("Selecione ao menos um processo para importar.", "warning");
          return;
        }

        const toImport = filteredSearchResults.filter(r => selectedResultIds.has(r.id));
        const newKanban = toImport.map(item => ({
          ...item,
          id: `lead_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`,
          stage: "recem_importados",
          assignedLawyer: "Dr. Você (Titular)",
          importedAt: currentTime,
          expiresAt: currentTime + FIVE_DAYS_MS,
          isClosed: false,
          documents: {},
          notes: `Importado via Busca Processos API (${item.isRealApiData ? 'Dados Oficiais Reais' : 'Simulado'}). Comarca: ${item.comarca}.`
        }));

        setLeads(prev => [...newKanban, ...prev]);
        setSelectedResultIds(new Set());
        showToast(`${newKanban.length} processo(s) importados para seu Kanban com exclusividade de 5 dias!`, "success");
        setActiveTab("kanban");
      };

      // KPIs Dashboard
      const dashboardStats = useMemo(() => {
        const total = leads.length;
        const closed = leads.filter(l => l.isClosed || l.stage === 'contrato_fechado');
        const active = leads.filter(l => !l.isClosed && l.stage !== 'contrato_fechado');
        const totalCausa = leads.reduce((acc, l) => acc + (l.valor_causa || 0), 0);
        const honorarios = totalCausa * 0.20;

        const urgent = active.filter(l => {
          if (!l.expiresAt) return false;
          const diff = l.expiresAt - currentTime;
          return diff > 0 && diff < (24 * 60 * 60 * 1000);
        });

        const byStage = {
          recem_importados: leads.filter(l => l.stage === 'recem_importados').length,
          contato_inicial: leads.filter(l => l.stage === 'contato_inicial').length,
          em_reuniao: leads.filter(l => l.stage === 'em_reuniao').length,
          contrato_fechado: closed.length
        };

        const byClass = {};
        leads.forEach(l => {
          byClass[l.classe] = (byClass[l.classe] || 0) + 1;
        });

        return {
          totalProcessos: total,
          contratosFechados: closed.length,
          taxaConversao: total > 0 ? Math.round((closed.length / total) * 100) : 0,
          valorTotalPipeline: totalCausa,
          honorariosPotenciais: honorarios,
          leadsUrgentes: urgent.length,
          leadsPoolExpirados: poolLeads.length,
          byStage,
          byClass
        };
      }, [leads, poolLeads, currentTime]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* TOAST FLUTUANTE */}
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border backdrop-blur-md bg-slate-900/95 border-amber-500/40 text-slate-100 animate-slide-in">
              <Icon name={toastMessage.type === 'warning' ? 'AlertCircle' : 'CheckCircle2'} size={20} className={toastMessage.type === 'warning' ? 'text-amber-400' : 'text-emerald-400'} />
              <span className="text-sm font-medium">{toastMessage.title}</span>
            </div>
          )}

          {/* CABEÇALHO */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 px-6 py-3.5 flex items-center justify-between">
            <div className="flex items-center gap-4">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 via-amber-500 to-yellow-400 flex items-center justify-center text-slate-950 shadow-lg shadow-amber-500/20 font-black">
                <Icon name="Scale" size={22} className="stroke-[2.5]" />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-lg font-bold text-white flex items-center gap-1.5">
                    JuriFlow <span className="text-amber-400 font-extrabold text-xs px-2 py-0.5 bg-amber-400/10 rounded border border-amber-400/30">CRM Legal</span>
                  </h1>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    API Oficial v1 Conectada
                  </span>
                </div>
                <p className="text-xs text-slate-400">Prospecção de Processos & Esteira de Documentos</p>
              </div>
            </div>

            {/* BARRA DE NAVEGAÇÃO DE ABAS */}
            <nav className="flex items-center gap-1 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
              <button
                onClick={() => setActiveTab("prospeccao")}
                className={`flex items-center gap-2 px-3.5 py-2 text-xs font-semibold rounded-lg transition ${
                  activeTab === "prospeccao" ? "bg-amber-500 text-slate-950 font-bold shadow" : "text-slate-400 hover:text-slate-200"
                }`}
              >
                <Icon name="Search" size={15} />
                1. Buscar & Cadastrar (API)
              </button>

              <button
                onClick={() => setActiveTab("kanban")}
                className={`flex items-center gap-2 px-3.5 py-2 text-xs font-semibold rounded-lg transition relative ${
                  activeTab === "kanban" ? "bg-amber-500 text-slate-950 font-bold shadow" : "text-slate-400 hover:text-slate-200"
                }`}
              >
                <Icon name="Kanban" size={15} />
                2. Meu Kanban
                <span className="ml-1 px-1.5 py-0.2 rounded-full text-[10px] bg-slate-900 text-amber-300 font-bold border border-amber-500/30">
                  {leads.length}
                </span>
              </button>

              <button
                onClick={() => setActiveTab("pool")}
                className={`flex items-center gap-2 px-3.5 py-2 text-xs font-semibold rounded-lg transition relative ${
                  activeTab === "pool" ? "bg-amber-500 text-slate-950 font-bold shadow" : "text-slate-400 hover:text-slate-200"
                }`}
              >
                <Icon name="Inbox" size={15} />
                3. Funil Geral (Pool)
                {poolLeads.length > 0 && (
                  <span className="ml-1 px-1.5 py-0.2 rounded-full text-[10px] bg-red-500/20 text-red-300 font-bold border border-red-500/40 animate-pulse">
                    {poolLeads.length}
                  </span>
                )}
              </button>

              <button
                onClick={() => setActiveTab("dashboard")}
                className={`flex items-center gap-2 px-3.5 py-2 text-xs font-semibold rounded-lg transition ${
                  activeTab === "dashboard" ? "bg-amber-500 text-slate-950 font-bold shadow" : "text-slate-400 hover:text-slate-200"
                }`}
              >
                <Icon name="BarChart3" size={15} />
                4. Dashboard
              </button>
            </nav>

            {/* BOTÕES SUPERIORES */}
            <div className="flex items-center gap-3">
              <button
                onClick={() => setIsSettingsOpen(true)}
                className="flex items-center gap-1.5 px-3 py-2 text-xs rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:text-white"
              >
                <Icon name="Settings" size={14} />
                <span>API Config</span>
              </button>

              <div className="flex items-center gap-2 pl-3 border-l border-slate-800">
                <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-sky-600 to-indigo-600 flex items-center justify-center font-bold text-xs text-white">
                  DV
                </div>
                <div className="text-left hidden md:block">
                  <div className="text-xs font-medium text-slate-200">Dr. Advogado Titular</div>
                  <div className="text-[10px] text-amber-400">OAB/SP 438.910</div>
                </div>
              </div>
            </div>
          </header>

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex-1 p-6 max-w-[1600px] w-full mx-auto">
            {/* ======================================================== */}
            {/* ABA 1: PROSPECÇÃO ATIVA VIA API BUSCA PROCESSOS */}
            {/* ======================================================== */}
            {activeTab === "prospeccao" && (
              <div className="space-y-6">
                {/* Banner de Consulta Real */}
                <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <div className="p-3 bg-amber-500/10 text-amber-400 rounded-xl border border-amber-500/20">
                      <Icon name="Sparkles" size={22} />
                    </div>
                    <div>
                      <h2 className="text-sm font-bold text-white flex items-center gap-2">
                        Consulta Oficial Busca Processos API (v1/processos)
                      </h2>
                      <p className="text-xs text-slate-400">
                        Retorna processos judiciais reais públicos por CPF ou CNPJ nos tribunais brasileiros.
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-400">Exemplos reais:</span>
                    {SAMPLE_CNPJS.map(sample => (
                      <button
                        key={sample.clean}
                        onClick={() => {
                          setSearchTerm(sample.cnpj);
