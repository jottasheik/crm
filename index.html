                        }}
                        className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-medium text-slate-300 border border-slate-700"
                      >
                        {sample.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* FORMULÁRIO DE BUSCA & FILTROS (INCLUINDO COMARCA E EXECUÇÃO DE TÍTULO EXTRAJUDICIAL) */}
                <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl space-y-4">
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                    {/* CPF / CNPJ */}
                    <div className="lg:col-span-4">
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                        CPF ou CNPJ para Consulta Oficial
                      </label>
                      <div className="relative">
                        <input
                          type="text"
                          value={searchTerm}
                          onChange={(e) => setSearchTerm(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && handleExecuteSearch()}
                          placeholder="Ex: 33.000.167/0001-01 ou apenas dígitos"
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 pl-10 text-sm text-slate-100 placeholder-slate-500 focus:border-amber-500 focus:outline-none"
                        />
                        <div className="absolute left-3 top-3 text-slate-400">
                          <Icon name="Search" size={17} />
                        </div>
                      </div>
                    </div>

                    {/* FILTRO POR COMARCA (SOLICITADO) */}
                    <div className="lg:col-span-3">
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                        Filtrar por Comarca
                      </label>
                      <div className="relative">
                        <input
                          type="text"
                          value={comarcaFilter}
                          onChange={(e) => setComarcaFilter(e.target.value)}
                          placeholder="Ex: São Paulo, Campinas, Capital..."
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 pl-9 text-xs text-slate-100 placeholder-slate-500 focus:border-amber-500 focus:outline-none"
                        />
                        <div className="absolute left-3 top-3 text-slate-400">
                          <Icon name="MapPin" size={15} />
                        </div>
                        {comarcaFilter && (
                          <button onClick={() => setComarcaFilter("")} className="absolute right-3 top-3 text-slate-500 hover:text-slate-300">
                            <Icon name="X" size={14} />
                          </button>
                        )}
                      </div>
                    </div>

                    {/* FILTRO DE POLO */}
                    <div className="lg:col-span-2">
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">Polo</label>
                      <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-700">
                        {["Ambos", "Polo Ativo", "Polo Passivo"].map((p) => (
                          <button
                            key={p}
                            type="button"
                            onClick={() => setPoloFilter(p)}
                            className={`flex-1 py-1.5 text-xs font-medium rounded-lg transition ${
                              poloFilter === p ? "bg-amber-500 text-slate-950 font-bold shadow" : "text-slate-400 hover:text-slate-200"
                            }`}
                          >
                            {p.replace("Polo ", "")}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* MULTISSELEÇÃO DE CLASSES (COM EXECUÇÃO DE TÍTULO EXTRAJUDICIAL) */}
                    <div className="lg:col-span-3 relative">
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                        Classes Processuais ({selectedClasses.length})
                      </label>
                      <div
                        onClick={() => setIsClassDropdownOpen(!isClassDropdownOpen)}
                        className="min-h-[42px] bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 flex flex-wrap items-center gap-1.5 cursor-pointer hover:border-slate-600"
                      >
                        {selectedClasses.length === 0 ? (
                          <span className="text-xs text-slate-500">Todas as classes</span>
                        ) : (
                          selectedClasses.map(cls => (
                            <span
                              key={cls}
                              className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30"
                              onClick={(e) => {
                                e.stopPropagation();
                                setSelectedClasses(prev => prev.filter(c => c !== cls));
                              }}
                            >
                              {cls}
                              <Icon name="X" size={11} className="hover:text-red-400" />
                            </span>
                          ))
                        )}
                        <span className="ml-auto text-xs text-slate-400">▼</span>
                      </div>

                      {isClassDropdownOpen && (
                        <div className="absolute z-30 mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl shadow-2xl p-2 max-h-56 overflow-y-auto">
                          {AVAILABLE_CLASSES.map(cls => {
                            const isSelected = selectedClasses.includes(cls);
                            return (
                              <label key={cls} className="flex items-center gap-2 px-2 py-1.5 text-xs text-slate-300 hover:bg-slate-800 rounded-lg cursor-pointer">
                                <input
                                  type="checkbox"
                                  checked={isSelected}
                                  onChange={() => {
                                    if (isSelected) setSelectedClasses(prev => prev.filter(c => c !== cls));
                                    else setSelectedClasses(prev => [...prev, cls]);
                                  }}
                                  className="rounded border-slate-700 text-amber-500 bg-slate-950"
                                />
                                <span>{cls}</span>
                              </label>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Segunda Linha: Valores, Datas e Botões de Consulta */}
                  <div className="grid grid-cols-1 md:grid-cols-5 gap-3 pt-2 border-t border-slate-800 items-end">
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">Valor Mínimo (R$)</label>
                      <input
                        type="number"
                        placeholder="Ex: 50000"
                        value={valorMin}
                        onChange={(e) => setValorMin(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">Valor Máximo (R$)</label>
                      <input
                        type="number"
                        placeholder="Ex: 800000"
                        value={valorMax}
                        onChange={(e) => setValorMax(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">Data Autuação (De)</label>
                      <input
                        type="date"
                        value={dataInicio}
                        onChange={(e) => setDataInicio(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">Data Autuação (Até)</label>
                      <input
                        type="date"
                        value={dataFim}
                        onChange={(e) => setDataFim(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs"
                      />
                    </div>
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={handleExecuteSearch}
                        disabled={isSearching}
                        className="flex-1 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-bold text-xs flex items-center justify-center gap-1.5 shadow-lg shadow-amber-500/20 disabled:opacity-50"
                      >
                        {isSearching ? <Icon name="RefreshCw" size={14} className="animate-spin" /> : <Icon name="Search" size={14} />}
                        <span>{isSearching ? "Consultando API..." : "Buscar na API Oficial"}</span>
                      </button>
                      <button
                        type="button"
                        onClick={handleGenerateTestDataset}
                        title="Carregar lote simulado com Execução de Título Extrajudicial"
                        className="px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-xs border border-slate-700"
                      >
                        🧪 Testar
                      </button>
                    </div>
                  </div>

                  {apiSearchError && (
                    <div className="p-3 rounded-xl bg-red-950/30 border border-red-500/30 flex items-center gap-2 text-xs text-red-300">
                      <Icon name="AlertCircle" size={16} className="text-red-400 flex-shrink-0" />
                      <span>{apiSearchError}</span>
                    </div>
                  )}
                </div>

                {/* TABELA DE RESULTADOS */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                  <div className="p-4 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                      <h3 className="text-sm font-bold text-white flex items-center gap-2">
                        Processos Listados:
                        <span className="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 text-xs font-bold">
                          {filteredSearchResults.length}
                        </span>
                      </h3>
                      {searchDataSource && (
                        <span className={`text-[11px] px-2.5 py-0.5 rounded-md font-semibold ${
                          searchDataSource === 'api_real'
                            ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                            : 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30'
                        }`}>
                          {searchDataSource === 'api_real' ? '⚡ Dados Reais Oficiais da API' : '🧪 Dados de Teste Simulados'}
                        </span>
                      )}
                    </div>

                    <div className="flex items-center gap-3">
                      <span className="text-xs text-slate-400">
                        {selectedResultIds.size} selecionados
                      </span>
                      <button
                        onClick={handleImportSelected}
                        disabled={selectedResultIds.size === 0}
                        className="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 text-slate-950 font-bold text-xs flex items-center gap-2 shadow-lg shadow-emerald-500/20 disabled:opacity-40"
                      >
                        <Icon name="Plus" size={16} />
                        <span>Importar Selecionados para o Meu Kanban (+5d)</span>
                      </button>
                    </div>
                  </div>

                  {filteredSearchResults.length === 0 ? (
                    <div className="p-12 text-center space-y-3">
                      <div className="w-12 h-12 mx-auto rounded-full bg-slate-800 flex items-center justify-center text-slate-500">
                        <Icon name="Search" size={24} />
                      </div>
                      <h4 className="text-sm font-semibold text-slate-300">Nenhum processo carregado</h4>
                      <p className="text-xs text-slate-500 max-w-md mx-auto">
                        Clique em <strong>"Buscar na API Oficial"</strong> para consultar processos reais via chave da Busca Processos, ou use os atalhos de exemplo acima.
                      </p>
                    </div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-950 text-slate-400 border-b border-slate-800 uppercase tracking-wider text-[11px]">
                          <tr>
                            <th className="py-3 px-4 w-10">
                              <input
                                type="checkbox"
                                checked={filteredSearchResults.length > 0 && selectedResultIds.size === filteredSearchResults.length}
                                onChange={() => {
                                  if (selectedResultIds.size === filteredSearchResults.length) setSelectedResultIds(new Set());
                                  else setSelectedResultIds(new Set(filteredSearchResults.map(r => r.id)));
                                }}
                                className="rounded border-slate-700 text-amber-500 bg-slate-900"
                              />
                            </th>
                            <th className="py-3 px-4">Processo (CNJ) / Tribunal</th>
                            <th className="py-3 px-4">Classe Processual</th>
                            <th className="py-3 px-4">Comarca</th>
                            <th className="py-3 px-4">Polo Ativo (Autor)</th>
                            <th className="py-3 px-4">Polo Passivo (Réu)</th>
                            <th className="py-3 px-4">Valor da Causa</th>
                            <th className="py-3 px-4">Autuação</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {filteredSearchResults.map(item => {
                            const isSelected = selectedResultIds.has(item.id);
                            return (
                              <tr key={item.id} className={`hover:bg-slate-800/40 transition ${isSelected ? 'bg-amber-500/5' : ''}`}>
                                <td className="py-3.5 px-4">
                                  <input
                                    type="checkbox"
                                    checked={isSelected}
                                    onChange={() => {
                                      const next = new Set(selectedResultIds);
                                      if (next.has(item.id)) next.delete(item.id);
                                      else next.add(item.id);
                                      setSelectedResultIds(next);
                                    }}
                                    className="rounded border-slate-700 text-amber-500 bg-slate-900"
                                  />
                                </td>
                                <td className="py-3.5 px-4">
                                  <div className="font-mono font-medium text-slate-100 flex items-center gap-1.5">
                                    <Icon name="Gavel" size={13} className="text-amber-400" />
                                    {item.numero_processo}
                                  </div>
                                  <div className="text-[10px] text-slate-400 mt-0.5">
                                    <span className="px-1.5 py-0.2 rounded bg-slate-800 font-bold text-slate-300">{item.tribunal}</span>
                                  </div>
                                </td>
                                <td className="py-3.5 px-4">
                                  <span className={`px-2 py-0.5 rounded text-[11px] font-semibold border ${
                                    item.classe.includes("Extrajudicial")
                                      ? 'bg-amber-500/20 text-amber-300 border-amber-500/30'
                                      : 'bg-slate-800 text-indigo-300 border-slate-700'
                                  }`}>
                                    {item.classe}
                                  </span>
                                </td>
                                <td className="py-3.5 px-4">
                                  <span className="inline-flex items-center gap-1 text-slate-300 text-[11px]">
                                    <Icon name="MapPin" size={12} className="text-slate-500" />
                                    {item.comarca}
                                  </span>
                                </td>
                                <td className="py-3.5 px-4 max-w-xs truncate text-slate-200" title={item.polo_ativo}>
                                  {item.polo_ativo}
                                </td>
                                <td className="py-3.5 px-4 max-w-xs truncate text-slate-200" title={item.polo_passivo}>
                                  {item.polo_passivo}
                                </td>
                                <td className="py-3.5 px-4 font-bold text-emerald-400">
                                  {formatBRL(item.valor_causa)}
                                </td>
                                <td className="py-3.5 px-4 text-slate-400 font-mono text-[11px]">
                                  {formatDate(item.data_autuacao)}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* ABA 2: QUADRO KANBAN DE 4 ETAPAS COM GATEKEEPER DE CONTRATO */}
            {/* ======================================================== */}
            {activeTab === "kanban" && (
              <div className="space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-slate-900 border border-slate-800">
                  <div className="flex items-center gap-3">
                    <div className="p-2.5 bg-amber-500/10 text-amber-400 rounded-xl border border-amber-500/20">
                      <Icon name="Kanban" size={20} />
                    </div>
                    <div>
                      <h2 className="text-sm font-bold text-white flex items-center gap-2">
                        Funil de Conversão & Posse de Leads (5 Dias)
                      </h2>
                      <p className="text-xs text-slate-400">
                        Para mover para <strong>"Contrato Fechado"</strong>, é obrigatório anexar o PDF do contrato assinado.
                      </p>
                    </div>
                  </div>

                  <button
                    onClick={() => setActiveTab("prospeccao")}
                    className="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold flex items-center gap-1.5 shadow"
                  >
                    <Icon name="Plus" size={15} />
                    <span>Consultar Novos Processos</span>
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-start">
                  {KANBAN_STAGES.map(stage => {
                    const stageLeads = leads.filter(l => l.stage === stage.id);
                    const isClosedColumn = stage.id === "contrato_fechado";

                    return (
                      <div
                        key={stage.id}
                        onDragOver={handleDragOver}
                        onDrop={() => handleDrop(stage.id)}
                        className={`bg-slate-900 rounded-2xl border-t-4 ${stage.color} border-slate-800 border-x border-b shadow-xl flex flex-col min-h-[580px]`}
                      >
                        <div className="p-3.5 border-b border-slate-800 flex items-center justify-between">
                          <span className="font-bold text-xs text-white uppercase tracking-wider">{stage.title}</span>
                          <span className={`px-2 py-0.5 rounded-full text-xs font-bold ${stage.badgeBg}`}>
                            {stageLeads.length}
                          </span>
                        </div>

                        <div className="p-3 space-y-3 flex-1 overflow-y-auto max-h-[700px]">
                          {stageLeads.length === 0 ? (
                            <div className="h-36 flex flex-col items-center justify-center text-center p-4 border-2 border-dashed border-slate-800 rounded-xl">
                              <p className="text-xs text-slate-500">Arraste processos para cá</p>
                            </div>
                          ) : (
                            stageLeads.map(lead => {
                              const timeInfo = getTimeRemaining(lead.expiresAt, lead.isClosed || isClosedColumn);
                              const attachedDocsCount = Object.keys(lead.documents || {}).length;

                              return (
                                <div
                                  key={lead.id}
                                  draggable
                                  onDragStart={() => handleDragStart(lead.id)}
                                  onClick={() => {
                                    setSelectedLeadModal(lead);
                                    setModalActiveTab("dados");
                                  }}
                                  className={`p-3.5 rounded-xl border bg-slate-950 hover:border-slate-600 transition cursor-pointer shadow group relative ${
                                    isClosedColumn
                                      ? 'border-emerald-500/40 bg-emerald-950/10'
                                      : timeInfo.isUrgent
                                      ? 'border-red-500/60 bg-red-950/20 animate-pulse'
                                      : 'border-slate-800'
                                  }`}
                                >
                                  {/* Cronômetro ou Isenção */}
                                  <div className="flex items-center justify-between gap-1 mb-2">
                                    <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-semibold truncate max-w-[130px]">
                                      {lead.classe}
                                    </span>

                                    {isClosedColumn ? (
                                      <span className="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                                        <Icon name="Lock" size={11} />
                                        Definitivo (Fechado)
                                      </span>
                                    ) : (
                                      <span className={`inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded border ${
                                        timeInfo.isUrgent ? 'bg-red-500/20 text-red-300 border-red-500/40' : 'bg-amber-500/10 text-amber-400 border-amber-500/30'
                                      }`}>
                                        <Icon name="Clock" size={11} className={timeInfo.isUrgent ? 'animate-spin' : ''} />
                                        {timeInfo.text}
                                      </span>
                                    )}
                                  </div>

                                  <div className="font-mono text-xs font-semibold text-white mb-1 truncate flex items-center gap-1">
                                    <Icon name="FileText" size={12} className="text-amber-400" />
                                    {lead.numero_processo}
                                  </div>

                                  <div className="text-[10px] text-slate-400 flex items-center gap-1 mb-2">
                                    <Icon name="MapPin" size={11} className="text-slate-500" />
                                    <span>{lead.comarca}</span>
                                    <span>• {lead.tribunal}</span>
                                  </div>

                                  <div className="text-[11px] text-slate-300 space-y-0.5 mb-2.5">
                                    <div className="truncate"><span className="text-slate-500">Autor:</span> {lead.polo_ativo}</div>
                                    <div className="truncate"><span className="text-slate-500">Réu:</span> {lead.polo_passivo}</div>
                                  </div>

                                  {/* Indicador de Documentos para Contratos Fechados */}
                                  {isClosedColumn && (
                                    <div className="mb-2 p-1.5 rounded-lg bg-emerald-950/30 border border-emerald-500/20 flex items-center justify-between text-[10px]">
                                      <span className="text-emerald-300 font-semibold flex items-center gap-1">
                                        <Icon name="FolderOpen" size={12} />
                                        Documentos Anexados:
                                      </span>
                                      <span className="font-bold text-white px-1.5 py-0.2 bg-emerald-500/20 rounded">
                                        {attachedDocsCount}/7
                                      </span>
                                    </div>
                                  )}

                                  <div className="flex items-center justify-between pt-2 border-t border-slate-800">
                                    <span className="text-xs font-bold text-emerald-400">{formatBRL(lead.valor_causa)}</span>
                                    {!isClosedColumn && (
                                      <button
                                        type="button"
                                        onClick={(e) => handleRenewExclusivity(lead.id, e)}
                                        className="px-2 py-0.5 rounded bg-amber-500/20 hover:bg-amber-500 text-amber-300 hover:text-slate-950 text-[10px] font-bold border border-amber-500/30 transition"
                                      >
                                        +5 dias
                                      </button>
                                    )}
                                  </div>

                                  {/* Atalho Numérico de Mudança de Etapa */}
                                  <div className="mt-2 pt-2 border-t border-slate-800 flex items-center justify-between text-[10px]">
                                    <span className="text-slate-500">Mover:</span>
                                    <div className="flex items-center gap-1">
                                      {KANBAN_STAGES.map(st => (
                                        <button
                                          key={st.id}
                                          type="button"
                                          disabled={st.id === stage.id}
                                          onClick={(e) => {
                                            e.stopPropagation();
                                            handleRequestStageChange(lead.id, st.id);
                                          }}
                                          title={`Mover para ${st.title}`}
                                          className={`w-5 h-5 rounded text-[10px] font-bold transition ${
                                            st.id === stage.id
                                              ? 'bg-slate-800 text-slate-600 cursor-not-allowed'
                                              : 'bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300'
                                          }`}
                                        >
                                          {st.id === 'recem_importados' ? '1' : st.id === 'contato_inicial' ? '2' : st.id === 'em_reuniao' ? '3' : '4'}
                                        </button>
                                      ))}
                                    </div>
                                  </div>
                                </div>
                              );
                            })
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* ABA 3: FUNIL GERAL DA EMPRESA (POOL) */}
            {/* ======================================================== */}
            {activeTab === "pool" && (
              <div className="space-y-6">
                <div className="p-4 rounded-xl bg-red-950/20 border border-red-500/30 flex items-center justify-between">
                  <div>
                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                      <Icon name="Inbox" size={18} className="text-red-400" />
                      Funil Geral da Empresa (Pool de Leads Expirados)
                    </h3>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Processos não fechados no prazo de 5 dias retornam ao escritório e podem ser resgatados com mais 5 dias de exclusividade.
                    </p>
                  </div>
                  <span className="px-3 py-1 bg-red-500/20 text-red-300 text-xs font-bold rounded-full border border-red-500/40">
                    {poolLeads.length} disponíveis
                  </span>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                  {poolLeads.length === 0 ? (
                    <div className="p-12 text-center text-slate-400 text-xs">
                      Nenhum lead expirado no momento. Todos os processos estão sob acompanhamento ativo.
                    </div>
                  ) : (
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                        <tr>
                          <th className="py-3 px-4">Processo (CNJ)</th>
                          <th className="py-3 px-4">Classe</th>
                          <th className="py-3 px-4">Comarca</th>
                          <th className="py-3 px-4">Partes</th>
                          <th className="py-3 px-4">Valor da Causa</th>
                          <th className="py-3 px-4 text-right">Ação</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {poolLeads.map(item => (
                          <tr key={item.id} className="hover:bg-slate-800/40">
                            <td className="py-3 px-4 font-mono font-medium text-white">{item.numero_processo}</td>
                            <td className="py-3 px-4">{item.classe}</td>
                            <td className="py-3 px-4">{item.comarca}</td>
                            <td className="py-3 px-4 max-w-xs truncate">
                              <div><strong>Autor:</strong> {item.polo_ativo}</div>
                              <div><strong>Réu:</strong> {item.polo_passivo}</div>
                            </td>
                            <td className="py-3 px-4 font-bold text-emerald-400">{formatBRL(item.valor_causa)}</td>
                            <td className="py-3 px-4 text-right">
                              <button
                                onClick={() => handleClaimPoolLead(item.id)}
                                className="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs"
                              >
                                Atribuir a Mim (+5d)
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* ABA 4: DASHBOARD JURÍDICO */}
            {/* ======================================================== */}
            {activeTab === "dashboard" && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                  <div className="p-4 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-xs text-slate-400">Total de Processos</span>
                    <div className="text-2xl font-black text-white mt-1">{dashboardStats.totalProcessos}</div>
                  </div>
                  <div className="p-4 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-xs text-slate-400">Contratos Fechados</span>
                    <div className="text-2xl font-black text-emerald-400 mt-1">{dashboardStats.contratosFechados}</div>
                    <div className="text-[10px] text-emerald-400 mt-1">{dashboardStats.taxaConversao}% de conversão</div>
                  </div>
                  <div className="p-4 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-xs text-slate-400">Honorários Est. (20%)</span>
                    <div className="text-xl font-black text-amber-400 mt-1">{formatBRL(dashboardStats.honorariosPotenciais)}</div>
                  </div>
                  <div className="p-4 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-xs text-slate-400">Urgentes (&lt;24h)</span>
                    <div className="text-2xl font-black text-red-400 mt-1">{dashboardStats.leadsUrgentes}</div>
                  </div>
                  <div className="p-4 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-xs text-slate-400">Pool Geral</span>
                    <div className="text-2xl font-black text-indigo-400 mt-1">{dashboardStats.leadsPoolExpirados}</div>
                  </div>
                </div>

                <div className="p-5 rounded-xl bg-slate-900 border border-slate-800 space-y-4">
                  <h3 className="text-sm font-bold text-white">Distribuição por Classes Processuais na Carteira</h3>
                  <div className="space-y-3">
                    {Object.entries(dashboardStats.byClass).map(([classe, count]) => (
                      <div key={classe} className="space-y-1">
                        <div className="flex justify-between text-xs">
                          <span className="text-slate-300">{classe}</span>
                          <span className="font-bold text-white">{count} ({Math.round((count / (dashboardStats.totalProcessos || 1)) * 100)}%)</span>
                        </div>
                        <div className="w-full bg-slate-950 rounded-full h-2">
                          <div
                            className="bg-amber-500 h-2 rounded-full"
                            style={{ width: `${(count / (dashboardStats.totalProcessos || 1)) * 100}%` }}
                          ></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* ======================================================== */}
          {/* MODAL 1: GATEKEEPER DE CONTRATO ASSINADO (OBRIGATÓRIO) */}
          {/* ======================================================== */}
          {leadPendingClosing && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="bg-slate-900 border border-amber-500/50 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <div className="p-2 bg-emerald-500/20 text-emerald-400 rounded-lg">
                      <Icon name="FileCheck" size={20} />
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-white">Upload Obrigatório do Contrato Assinado</h3>
                      <p className="text-xs text-slate-400">Requisito para avançar o lead para Contrato Fechado</p>
                    </div>
                  </div>
                  <button onClick={() => setLeadPendingClosing(null)} className="text-slate-400 hover:text-white">
                    <Icon name="X" size={18} />
                  </button>
                </div>

                <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-1">
                  <div className="text-slate-400">Processo: <strong className="text-white font-mono">{leadPendingClosing.numero_processo}</strong></div>
                  <div className="text-slate-400">Cliente: <strong className="text-slate-200">{leadPendingClosing.polo_ativo}</strong></div>
                  <div className="text-slate-400">Valor da Causa: <strong className="text-emerald-400">{formatBRL(leadPendingClosing.valor_causa)}</strong></div>
                </div>

                {/* Upload Zone */}
                <div className="space-y-2">
                  <label className="block text-xs font-semibold text-slate-300">
                    Selecione o arquivo PDF do Contrato Assinado:
                  </label>
                  <label className="border-2 border-dashed border-slate-700 hover:border-amber-500/80 rounded-xl p-5 flex flex-col items-center justify-center gap-2 bg-slate-950 cursor-pointer transition">
                    <Icon name="Upload" size={24} className="text-amber-400" />
                    <span className="text-xs text-slate-300 font-medium">Clique para escolher o arquivo PDF</span>
                    <span className="text-[11px] text-slate-500">Formato aceito: .pdf (Contrato de Honorários Assinado)</span>
                    <input
                      type="file"
                      accept=".pdf"
                      className="hidden"
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) {
                          setUploadedContractFile({
                            name: file.name,
                            size: `${(file.size / 1024).toFixed(1)} KB`,
                            date: new Date().toLocaleDateString('pt-BR')
                          });
                        }
                      }}
                    />
                  </label>

                  {uploadedContractFile ? (
                    <div className="p-3 rounded-lg bg-emerald-950/30 border border-emerald-500/40 flex items-center justify-between text-xs">
                      <div className="flex items-center gap-2 text-emerald-300 font-medium truncate">
                        <Icon name="FileCheck" size={16} />
                        <span className="truncate">{uploadedContractFile.name}</span>
                        <span className="text-[10px] text-slate-400">({uploadedContractFile.size})</span>
                      </div>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold">Pronto</span>
                    </div>
                  ) : (
                    <div className="flex items-center justify-between pt-1">
                      <span className="text-[11px] text-amber-400 flex items-center gap-1">
                        <Icon name="AlertCircle" size={12} />
                        O avanço está bloqueado até o anexo do PDF.
                      </span>
                      {/* Atalho de simulação de teste rápido */}
                      <button
                        type="button"
                        onClick={() => {
                          setUploadedContractFile({
                            name: `Contrato_Honorarios_${leadPendingClosing.numero_processo.slice(0, 7)}_Assinado.pdf`,
                            size: "1.2 MB",
                            date: new Date().toLocaleDateString('pt-BR')
                          });
                        }}
                        className="text-[10px] text-slate-400 underline hover:text-amber-300"
                      >
                        (Simular anexo de PDF de teste)
                      </button>
                    </div>
                  )}
                </div>

                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                  <button
                    type="button"
                    onClick={() => setLeadPendingClosing(null)}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300"
                  >
                    Cancelar
                  </button>
                  <button
                    type="button"
                    disabled={!uploadedContractFile}
                    onClick={handleConfirmClosingWithContract}
                    className="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 text-slate-950 font-bold text-xs flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed shadow-lg"
                  >
                    <Icon name="CheckCircle2" size={16} />
                    <span>Avançar para Contrato Fechado</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL 2: DETALHES DO LEAD & ESTEIRA DE DOCUMENTOS */}
          {/* ======================================================== */}
          {selectedLeadModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
                <div className="flex items-start justify-between border-b border-slate-800 pb-3">
                  <div>
                    <span className="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300">
                      {selectedLeadModal.classe} • {selectedLeadModal.tribunal}
                    </span>
                    <h3 className="text-base font-bold text-white font-mono mt-1">
                      {selectedLeadModal.numero_processo}
                    </h3>
                  </div>
                  <button onClick={() => setSelectedLeadModal(null)} className="text-slate-400 hover:text-white">
                    <Icon name="X" size={20} />
                  </button>
                </div>

                {/* Sub-Abas do Modal */}
                <div className="flex border-b border-slate-800 gap-4 text-xs font-semibold">
                  <button
                    onClick={() => setModalActiveTab("dados")}
                    className={`pb-2 border-b-2 transition ${
                      modalActiveTab === "dados" ? "border-amber-500 text-amber-400" : "border-transparent text-slate-400 hover:text-white"
                    }`}
                  >
                    Dados do Processo & Posse
                  </button>

                  <button
                    onClick={() => setModalActiveTab("documentos")}
                    className={`pb-2 border-b-2 transition flex items-center gap-1.5 ${
                      modalActiveTab === "documentos" ? "border-amber-500 text-amber-400" : "border-transparent text-slate-400 hover:text-white"
                    }`}
                  >
                    <Icon name="FolderOpen" size={14} />
                    <span>Documentos do Cliente & Ajuizamento</span>
                    {selectedLeadModal.isClosed && (
                      <span className="px-1.5 py-0.2 rounded-full text-[10px] bg-emerald-500/20 text-emerald-300 font-bold">
                        {Object.keys(selectedLeadModal.documents || {}).length}/7
                      </span>
                    )}
                  </button>
                </div>

                {/* SUB-ABA 1: DADOS */}
                {modalActiveTab === "dados" && (
                  <div className="space-y-4">
                    <div className="grid grid-cols-2 gap-3 text-xs bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <div>
                        <span className="text-slate-500 block">Comarca:</span>
                        <span className="font-semibold text-slate-200">{selectedLeadModal.comarca}</span>
                      </div>
                      <div>
                        <span className="text-slate-500 block">Valor da Causa:</span>
                        <span className="font-bold text-emerald-400">{formatBRL(selectedLeadModal.valor_causa)}</span>
                      </div>
                      <div>
                        <span className="text-slate-500 block">Autor:</span>
                        <span className="font-semibold text-slate-200">{selectedLeadModal.polo_ativo}</span>
                      </div>
                      <div>
                        <span className="text-slate-500 block">Réu:</span>
                        <span className="font-semibold text-slate-200">{selectedLeadModal.polo_passivo}</span>
                      </div>
                    </div>

                    {/* Status da Trava Temporal */}
                    <div className={`p-4 rounded-xl border flex items-center justify-between ${
                      selectedLeadModal.isClosed ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-slate-950 border-slate-800'
                    }`}>
                      <div>
                        <div className="text-xs text-slate-400">Exclusividade do Lead:</div>
                        <div className="text-sm font-bold text-white">
                          {getTimeRemaining(selectedLeadModal.expiresAt, selectedLeadModal.isClosed).text}
                        </div>
                      </div>
                      {!selectedLeadModal.isClosed && (
                        <button
                          onClick={() => handleRenewExclusivity(selectedLeadModal.id)}
                          className="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs"
                        >
                          Renovar (+5 dias)
                        </button>
                      )}
                    </div>

                    {/* Mover Etapa */}
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">Alterar Etapa:</label>
                      <div className="grid grid-cols-4 gap-2">
                        {KANBAN_STAGES.map(st => (
                          <button
                            key={st.id}
                            onClick={() => handleRequestStageChange(selectedLeadModal.id, st.id)}
                            className={`py-2 px-1 text-xs rounded-lg font-semibold border ${
                              selectedLeadModal.stage === st.id ? 'bg-amber-500 text-slate-950 border-amber-400 font-bold' : 'bg-slate-950 text-slate-400 border-slate-800 hover:text-white'
                            }`}
                          >
                            {st.title}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* SUB-ABA 2: ESTEIRA DE DOCUMENTOS SOLICITADA */}
                {modalActiveTab === "documentos" && (
                  <div className="space-y-4">
                    <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                      <div>
                        <div className="text-xs font-bold text-white">Checklist de Documentação do Processo</div>
                        <div className="text-[11px] text-slate-400">Anexe ou atualize os documentos essenciais do cliente</div>
                      </div>
                      <span className="text-xs font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
                        {Object.keys(selectedLeadModal.documents || {}).length} de 7 Anexados
                      </span>
                    </div>

                    {/* LISTA DOS DOCUMENTOS SOLICITADOS */}
                    <div className="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                      {CLIENT_DOCUMENT_SLOTS.map((slot) => {
                        const attached = selectedLeadModal.documents && selectedLeadModal.documents[slot.id];

                        return (
                          <div
                            key={slot.id}
                            className={`p-3 rounded-xl border flex items-center justify-between gap-3 transition ${
                              attached ? 'bg-emerald-950/20 border-emerald-500/40' : 'bg-slate-950 border-slate-800'
                            }`}
                          >
                            <div className="flex items-center gap-3">
                              <div className={`p-2 rounded-lg ${attached ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-400'}`}>
                                <Icon name={slot.icon} size={16} />
                              </div>
                              <div>
                                <div className="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                                  <span>{slot.title}</span>
                                  {slot.required && <span className="text-[10px] text-red-400">*</span>}
                                </div>
                                {attached ? (
                                  <div className="text-[11px] text-emerald-400 flex items-center gap-1 mt-0.5">
                                    <Icon name="CheckCircle2" size={12} />
                                    <span className="truncate max-w-xs">{attached.name}</span>
                                    <span className="text-slate-500 text-[10px]">({attached.date})</span>
                                  </div>
                                ) : (
                                  <div className="text-[11px] text-slate-500">Documento pendente</div>
                                )}
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              <label className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-amber-300 font-semibold cursor-pointer border border-slate-700 transition flex items-center gap-1">
                                <Icon name="Upload" size={12} />
                                <span>{attached ? 'Substituir' : 'Anexar'}</span>
                                <input
                                  type="file"
                                  className="hidden"
                                  accept=".pdf,.png,.jpg,.jpeg"
                                  onChange={(e) => handleFileUploadForSlot(slot.id, e.target.files[0])}
                                />
                              </label>

                              {attached && (
                                <button
                                  type="button"
                                  onClick={() => {
                                    const next = { ...(selectedLeadModal.documents || {}) };
                                    delete next[slot.id];
                                    setLeads(prev => prev.map(l => l.id === selectedLeadModal.id ? { ...l, documents: next } : l));
                                    setSelectedLeadModal(prev => ({ ...prev, documents: next }));
                                    showToast(`Documento removido.`, "info");
                                  }}
                                  className="p-1.5 rounded-lg text-slate-500 hover:text-red-400 hover:bg-slate-800"
                                  title="Remover anexo"
                                >
                                  <Icon name="X" size={14} />
                                </button>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL 3: CONFIGURAÇÕES DA API */}
          {/* ======================================================== */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white">Configurações da Conexão Busca Processos</h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" size={18} />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Base Endpoint Oficial</label>
                    <input
                      type="text"
                      value={apiEndpoint}
                      onChange={(e) => setApiEndpoint(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 font-mono text-slate-200"
                    />
                    <p className="text-[10px] text-slate-500 mt-1">Conforme docs: <code>https://api.buscaprocessos.app.br</code></p>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Chave de API (x-api-key)</label>
                    <input
                      type="text"
                      value={apiKey}
                      onChange={(e) => setApiKey(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 font-mono text-amber-300"
                    />
                    <p className="text-[10px] text-slate-500 mt-1">Token live ativo para consultas de tribunais.</p>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => {
                        setApiKey(DEFAULT_API_KEY);
                        setApiEndpoint(OFFICIAL_API_BASE);
                        showToast("Configurações oficiais restauradas!", "info");
                      }}
                      className="text-slate-400 hover:text-slate-200 underline text-xs mr-auto"
                    >
                      Padrão
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setIsSettingsOpen(false);
                        showToast("Configurações salvas!", "success");
                      }}
                      className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg"
                    >
                      Salvar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<JuriFlowCRM />);
  </script>
</body>
</html>
